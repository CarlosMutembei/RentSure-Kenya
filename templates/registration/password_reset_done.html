{% extends 'base.html' %}
{% load static %}
{% block content %}

    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-2xl shadow-xl p-8 text-center">
            <div class="text-6xl mb-4">📧</div>
            <h2 class="text-2xl font-bold text-gray-800">Check Your Email</h2>
            <p class="text-gray-600 mt-2">We've sent you a link to reset your password.</p>
            <a href="{% url 'login' %}" class="inline-block mt-6 bg-green-600 text-white px-6 py-2 rounded-xl hover:bg-green-700">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
