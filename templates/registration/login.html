{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden transition-all duration-300 hover:shadow-2xl">
            <div class="bg-gradient-to-r from-green-700 to-green-500 px-6 py-8 text-center">
                <div class="text-white">
                    <span class="text-4xl">🔑</span>
                    <h1 class="text-3xl font-bold mt-2">Welcome Back</h1>
                    <p class="text-green-100 mt-1">Login to your account</p>
                </div>
            </div>
            <div class="px-6 py-8">
                <form method="post" class="space-y-5">
                    {% csrf_token %}
                    <div class="space-y-1">
                        <label class="block text-sm font-semibold text-gray-700">Username</label>
                        <input type="text" name="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" required>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-sm font-semibold text-gray-700">Password</label>
                        <input type="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" required>
                    </div>
                    <div class="flex items-center justify-between">
                        <a href="{% url 'password_reset' %}" class="text-sm text-green-600 hover:underline">Forgot password?</a>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-green-600 to-green-500 text-white font-bold py-3 px-4 rounded-xl hover:from-green-700 hover:to-green-600 transform transition-all duration-200 hover:scale-[1.02] shadow-md">
                        🔓 Login
                    </button>
                </form>
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-600">Don't have an account? <a href="{% url 'register' %}" class="font-semibold text-green-600 hover:underline">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
