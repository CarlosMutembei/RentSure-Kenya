{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-gradient-to-r from-indigo-700 to-indigo-500 px-6 py-8 text-center">
                <div class="text-white">
                    <span class="text-4xl">🔐</span>
                    <h1 class="text-3xl font-bold mt-2">Forgot Password?</h1>
                    <p class="text-indigo-100 mt-1">Enter your email to reset</p>
                </div>
            </div>
            <div class="px-6 py-8">
                <form method="post" class="space-y-5">
                    {% csrf_token %}
                    <div class="space-y-1">
                        <label class="block text-sm font-semibold text-gray-700">Email</label>
                        <input type="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-bold py-3 px-4 rounded-xl hover:scale-[1.02] transition shadow-md">
                        📧 Send Reset Link
                    </button>
                </form>
                <div class="mt-4 text-center">
                    <a href="{% url 'login' %}" class="text-sm text-indigo-600 hover:underline">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
