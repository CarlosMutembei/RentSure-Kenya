{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-gradient-to-r from-green-700 to-green-500 px-6 py-8 text-center">
                <div class="text-white">
                    <span class="text-4xl">🔑</span>
                    <h1 class="text-3xl font-bold mt-2">Set New Password</h1>
                </div>
            </div>
            <div class="px-6 py-8">
                <form method="post" class="space-y-5">
                    {% csrf_token %}
                    <div class="space-y-1">
                        <label class="block text-sm font-semibold text-gray-700">New Password</label>
                        <input type="password" name="new_password1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500" required>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-sm font-semibold text-gray-700">Confirm Password</label>
                        <input type="password" name="new_password2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500" required>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-green-600 to-green-500 text-white font-bold py-3 px-4 rounded-xl hover:scale-[1.02] transition shadow-md">
                        🔄 Reset Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
