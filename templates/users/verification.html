{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-gradient-to-r from-orange-600 to-orange-500 px-6 py-8 text-center">
                <div class="bg-gradient-to-br from-orange-500 to-orange-600 p-8 rounded-3xl shadow-xl border border-orange-400 text-white max-w-sm">
                    <div class="bg-white/20 w-16 h-16 rounded-2xl flex items-center justify-center mb-6 backdrop-blur-sm">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                    </div>
                    
                    <h1 class="text-2xl font-extrabold tracking-tight">Get Verified</h1>
                    <p class="text-orange-50 mt-2 opacity-90 leading-relaxed">
                        Submit your documents to earn your verified badge and increase your profile trust.
                    </p>
                    
                    <button class="mt-6 w-full bg-white text-orange-600 font-bold py-3 px-4 rounded-xl hover:bg-orange-50 transition-colors shadow-sm">
                        Start Verification
                    </button>
                </div>
            </div>
            <div class="px-6 py-8">
                <form method="post" enctype="multipart/form-data" class="space-y-5">
                    {% csrf_token %}
                    <div class="space-y-1">
                        <label class="block text-sm font-semibold text-gray-700">ID Number</label>
                        <input type="text" name="id_number" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500" required>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-sm font-semibold text-gray-700">KRA PIN</label>
                        <input type="text" name="kra_pin" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500">
                    </div>
                    <div class="space-y-1">
                        <label class="block text-sm font-semibold text-gray-700">Title Deed / Ownership Proof</label>
                        <input type="file" name="title_deed" accept=".pdf,.jpg,.png" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-orange-600 to-orange-500 text-white font-bold py-3 px-4 rounded-xl hover:scale-[1.02] transition shadow-md">
                        Submit Verification
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
