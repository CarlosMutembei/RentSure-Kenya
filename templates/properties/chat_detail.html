{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-4 sm:py-10 px-2 sm:px-4">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl sm:rounded-3xl shadow-xl overflow-hidden border border-gray-100">
            <!-- Header -->
            <div class="bg-gradient-to-r from-emerald-600 to-green-700 p-4 sm:p-6 text-white">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 sm:gap-4">
                        <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-2xl bg-white/20 flex items-center justify-center">
                            <i class="fa-solid fa-building text-lg sm:text-2xl"></i>
                        </div>
                        <div>
                            <h2 class="text-lg sm:text-1xl font-bold truncate max-w-[140px] sm:max-w-full">
                                {{ property.title }}
                            </h2>
                            <div class="flex items-center gap-2 mt-0.5 sm:mt-1 text-emerald-100">
                                <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 bg-green-300 rounded-full"></span>
                                <span class="text-xs sm:text-sm">
                                    {{ other_user.username }}
                                </span>
                            </div>
                        </div>
                    </div>
                    <a href="{% url 'chat_list' %}"
                       class="bg-white/20 hover:bg-white/30 px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl transition text-sm sm:text-base">
                        <i class="fa-solid fa-arrow-left mr-1 sm:mr-2"></i>
                        <span class="hidden xs:inline">Back</span>
                    </a>
                </div>
            </div>

            <!-- Messages -->
            <div id="chat-messages"
                 class="h-96 sm:h-[550px] overflow-y-auto p-4 sm:p-6 bg-gray-50 space-y-3 sm:space-y-4">
                {% for msg in chat_messages %}
                <div class="flex {% if msg.sender == user %}justify-end{% else %}justify-start{% endif %}">
                    <div class="max-w-[80%] sm:max-w-[75%]">
                        <div class="
                            px-4 sm:px-5 py-2 sm:py-3 rounded-2xl shadow-sm text-sm sm:text-base
                            {% if msg.sender == user %}
                                bg-gradient-to-r from-emerald-600 to-green-700 text-white rounded-br-md
                            {% else %}
                                bg-white text-gray-800 rounded-bl-md border border-gray-100
                            {% endif %}
                        ">
                            <p class="leading-relaxed">
                                {{ msg.message }}
                            </p>
                        </div>
                        <p class="
                            text-[10px] sm:text-xs mt-1 px-1 sm:px-2
                            {% if msg.sender == user %}
                                text-right text-gray-500
                            {% else %}
                                text-gray-500
                            {% endif %}
                        ">
                            {{ msg.created_at|date:"M d, H:i" }}
                        </p>
                    </div>
                </div>
                {% empty %}
                <div class="text-center py-12 sm:py-16">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 mx-auto rounded-full bg-emerald-100 flex items-center justify-center mb-3 sm:mb-4">
                        <i class="fa-solid fa-comments text-2xl sm:text-3xl text-emerald-600"></i>
                    </div>
                    <h3 class="text-lg sm:text-xl font-bold text-gray-700">No messages yet</h3>
                    <p class="text-xs sm:text-sm text-gray-500 mt-1 sm:mt-2">Start the conversation about this property.</p>
                </div>
                {% endfor %}
            </div>

            <!-- Message Input -->
            <div class="border-t bg-white p-3 sm:p-5">
                <div class="flex gap-2 sm:gap-3">
                    <input type="text" id="chat-message-input" placeholder="Type your message..."
                           class="flex-1 rounded-2xl border border-gray-200 px-4 sm:px-5 py-2.5 sm:py-3 text-sm sm:text-base focus:outline-none focus:ring-4 focus:ring-emerald-100 focus:border-emerald-600">
                    <button id="chat-message-submit"
                            class="bg-gradient-to-r from-emerald-600 to-green-700 hover:from-emerald-700 hover:to-green-800 text-white px-4 sm:px-6 rounded-2xl shadow-lg hover:shadow-xl transition text-sm sm:text-base">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ... (JavaScript remains the same as before)
    let chatSocket = null;
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 10;

    function getWebSocketUrl() {
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        return protocol + window.location.host + '{{ ws_url }}';
    }

    function connectWebSocket() {
        const wsUrl = getWebSocketUrl();
        chatSocket = new WebSocket(wsUrl);

        chatSocket.onopen = function() {
            console.log('WebSocket connected');
            reconnectAttempts = 0;
            document.getElementById('chat-message-submit').disabled = false;
            document.getElementById('chat-message-input').disabled = false;
        };

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const isMine = (data.sender_id === {{ user.id }});
            const messagesDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isMine ? 'justify-end' : 'justify-start'}`;
            messageDiv.innerHTML = `
                <div class="max-w-[80%] sm:max-w-[75%]">
                    <div class="px-4 sm:px-5 py-2 sm:py-3 rounded-2xl shadow-sm text-sm sm:text-base ${isMine ? 'bg-gradient-to-r from-emerald-600 to-green-700 text-white rounded-br-md' : 'bg-white border border-gray-100 text-gray-800 rounded-bl-md'}">
                        <p>${escapeHtml(data.message)}</p>
                    </div>
                    <p class="text-[10px] sm:text-xs text-gray-500 mt-1 ${isMine ? 'text-right' : ''}">
                        ${data.timestamp}
                    </p>
                </div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        };

        chatSocket.onclose = function(e) {
            console.warn('WebSocket closed. Code:', e.code, 'Reason:', e.reason);
            if (reconnectAttempts < maxReconnectAttempts) {
                reconnectAttempts++;
                const delay = Math.min(1000 * reconnectAttempts, 10000);
                setTimeout(connectWebSocket, delay);
            } else {
                console.error('Max reconnect attempts reached.');
                document.getElementById('chat-message-submit').disabled = true;
                document.getElementById('chat-message-input').disabled = true;
            }
        };

        chatSocket.onerror = function(e) {
            console.error('WebSocket error', e);
        };
    }

    function sendMessage() {
        const input = document.getElementById('chat-message-input');
        const message = input.value.trim();
        if (!message) return;

        if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
            chatSocket.send(JSON.stringify({ message: message }));
            input.value = '';
            input.focus();
        } else {
            console.warn('Socket not open. Attempting to reconnect...');
            connectWebSocket();
            setTimeout(() => {
                if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
                    sendMessage();
                } else {
                    alert('Connection lost. Please refresh the page.');
                }
            }, 1000);
        }
    }

    // Auto-scroll to bottom on load
    const messagesDiv = document.getElementById('chat-messages');
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    // Start connection
    connectWebSocket();

    // Bind event handlers
    document.getElementById('chat-message-submit').addEventListener('click', sendMessage);
    document.getElementById('chat-message-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    });

    function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return unsafe.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
{% endblock %}
