services:
  - type: web
    name: rentsure-kenya
    env: python
    plan: free
    # 1. Point this directly to your clean build script
    buildCommand: ./build.sh
    startCommand: poetry run gunicorn rentsure.wsgi:application
    
    # 2. Render installs these system dependencies BEFORE running your build script
    packages:
      - gdal-bin
      - libgdal-dev
      - binutils
      - libproj-dev
      - python3-dev
      - build-essential

    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: rentsure-db
          property: connectionString
      - key: GDAL_LIBRARY_PATH
        value: /usr/lib/x86_64-linux-gnu/libgdal.so
      - key: GDAL_DATA
        value: /usr/share/gdal
      - key: PROJ_LIB
        value: /usr/share/proj
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PIP_DEFAULT_TIMEOUT
        value: "100"

databases:
  - name: rentsure-db
    plan: free
    databaseName: rentsure_kenya
    user: rentsure_user