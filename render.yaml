services:
  - type: web
    name: rentsure-kenya
    env: python
    plan: free
    buildCommand: |
      apt-get update
      apt-get install -y --no-install-recommends \
        gdal-bin \
        libgdal-dev \
        binutils \
        libproj-dev \
        python3-dev \
        build-essential
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn rentsure.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: RENDER
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: rentsure-db
          property: connectionString
      - key: GDAL_LIBRARY_PATH
        value: /usr/lib/x86_64-linux-gnu/libgdal.so
      - key: GDAL_DATA
        value: /usr/share/gdal
      - key: PROJ_LIB
        value: /usr/share/proj
      - key: PYTHONUNBUFFERED
        value: true
      - key: PIP_DEFAULT_TIMEOUT
        value: 100

databases:
  - name: rentsure-db
    plan: free
    databaseName: rentsure_kenya
    user: rentsure_user