services:
  - type: web
    name: rentsure-kenya
    env: python
    plan: free  # ✅ Free tier
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn rentsure.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: RENDER
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: rentsure-db
          property: connectionString
      - key: GDAL_LIBRARY_PATH
        value: /usr/lib/libgdal.so
      - key: GDAL_DATA
        value: /usr/share/gdal
      - key: PROJ_LIB
        value: /usr/share/proj

databases:
  - name: rentsure-db
    plan: free  # ✅ Free tier database
    databaseName: rentsure_kenya
    user: rentsure_user